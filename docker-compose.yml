services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-jarvis_redis_pass}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jarvis_net
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jarvis_redis_pass}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - jarvis_net
    restart: unless-stopped

  stt:
    build:
      context: .
      dockerfile: services/stt/Dockerfile
    ports:
      - "${STT_PORT:-8001}:8001"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jarvis_redis_pass}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - jarvis_net
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    ports:
      - "${TTS_PORT:-8002}:8002"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jarvis_redis_pass}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - jarvis_net
    restart: unless-stopped

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    ports:
      - "${MEMORY_PORT:-8003}:8003"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jarvis_redis_pass}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - jarvis_net
    restart: unless-stopped

  tools:
    build:
      context: .
      dockerfile: services/tools/Dockerfile
    ports:
      - "${TOOLS_PORT:-8004}:8004"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jarvis_redis_pass}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - jarvis_net
    restart: unless-stopped

