[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
ignore = [
    "ANN", "ARG001", "BLE001", "COM812", "CPY001",
    "D100", "D101", "D102", "D103", "D104", "D107",
    "EM101", "EM102", "FBT001", "FBT002",
    "INP001", "PLC0415", "PLR2004", "PLW0602", "PLW0603",
    "PT011", "PT006", "S101", "S104", "S105",
    "TC003", "TRY003", "TRY300",
]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
target-version = ["py310"]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
