[project]
name = "jarvis-shared"
version = "0.1.0"
description = "Shared models, configuration, and utilities for J.A.R.V.I.S."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
