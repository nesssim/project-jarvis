# J.A.R.V.I.S. — Central Configuration
# Every model/provider choice lives here.
# Swapping free→paid later is a one-line change.

service:
  orchestrator:
    host: "0.0.0.0"
    port: 8000
  stt:
    host: "0.0.0.0"
    port: 8001
  tts:
    host: "0.0.0.0"
    port: 8002
  memory:
    host: "0.0.0.0"
    port: 8003
  tools:
    host: "0.0.0.0"
    port: 8004

redis:
  url: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  streams:
    consumer_group: "jarvis"
    max_length: 10000

llm:
  provider: "ollama"
  max_context_tokens: 4096
  ollama:
    url: "http://ollama:11434"
    model: "qwen2.5:8b"
    keep_alive: -1
  groq:
    api_key: "${GROQ_API_KEY}"
    model: "llama-3.3-70b-versatile"
  gemini:
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-2.0-flash"
  generation:
    max_tokens: 512
    temperature: 0.7
    top_p: 0.9

stt:
  provider: "whisper"
  whisper:
    model_size: "base"
    device: "cpu"
    compute_type: "int8"
  vad:
    threshold: 0.5
    silence_duration_ms: 800
    max_instances: 50

tts:
  provider: "piper"
  piper:
    voice: "default"
    model_path: "/models/piper"
  kokoro:
    voice: "default"

audio:
  sample_rate: 16000
  channels: 1
  sample_width: 2
  chunk_size_ms: 100

listening:
  timeout_seconds: 5
  silence_threshold_ms: 800
  max_utterance_seconds: 30
  barge_in_enabled: true
  barge_in_jitter_ms: 200

wake_word:
  enabled: false
  model_path: "/models/wake-word"
  sensitivity: 0.5
  vad_cooldown_ms: 2000

memory:
  short_term:
    max_turns: 20
  long_term:
    provider: "chromadb"
    chromadb:
      path: "/data/chromadb"
    embedding_model: "nomic-embed-text"
    max_facts_per_query: 5
    latency_threshold_ms: 100

tools:
  web_search:
    provider: "searxng"
    searxng_url: "http://searxng:8888"
    fallback_provider: "duckduckgo"
  sandbox:
    allowed_directory: "/data/sandbox"
  safety_tiers:
    safe: ["get_datetime", "web_search", "read_file"]
    confirm: ["send_email", "write_file", "delete_file"]
    restricted: ["execute_command", "modify_system", "control_hardware"]

rate_limiting:
  default: "60/minute"
  per_endpoint:
    /chat: "30/minute"
    /health: "120/minute"

logging:
  level: "INFO"
  format: "json"
  correlation_id: true
  redact_fields: ["api_key", "password", "token"]

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization", "X-API-Key"]

auth:
  enabled: false
  api_key_header: "X-API-Key"
  api_key: ""

shutdown:
  grace_period_seconds: 10
  force_exit_after_seconds: 15
