name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff black mypy
          pip install -e shared/
      - name: Ruff lint
        run: ruff check .
      - name: Black format check
        run: black --check .
      - name: MyPy type check
        run: mypy shared/src/ services/orchestrator/src/ services/stt/src/ services/tts/src/ services/memory/src/ services/tools/src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-mock fakeredis[lua] httpx
          pip install -e shared/
          pip install -e services/orchestrator/
          pip install -e services/stt/
          pip install -e services/tts/
          pip install -e services/memory/
          pip install -e services/tools/
      - name: Run tests
        run: pytest tests/ --cov=shared --cov=services --cov-report=term-missing --cov-fail-under=80 -v
        env:
          PYTHONPATH: .:shared/src:services/orchestrator/src:services/stt/src:services/tts/src:services/memory/src:services/tools/src

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -f services/orchestrator/Dockerfile -t jarvis-orchestrator:ci .
          docker build -f services/stt/Dockerfile -t jarvis-stt:ci .
          docker build -f services/tts/Dockerfile -t jarvis-tts:ci .
          docker build -f services/memory/Dockerfile -t jarvis-memory:ci .
          docker build -f services/tools/Dockerfile -t jarvis-tools:ci .
